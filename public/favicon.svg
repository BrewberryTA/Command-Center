<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" fill="#0a0a0f"/>
  <rect x="4" y="4" width="24" height="24" rx="2" stroke="#00f5ff" stroke-width="1.5" fill="none" opacity="0.6"/>
  <text x="16" y="22" font-family="monospace" font-size="16" font-weight="bold" fill="#00f5ff" text-anchor="middle" filter="url(#glow)">⌘</text>
  <defs>
    <filter id="glow">
